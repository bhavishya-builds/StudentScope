<svg viewBox="0 0 1440 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0015"/><stop offset="60%" stop-color="#1a0030"/><stop offset="100%" stop-color="#2d0050"/></linearGradient>
    <linearGradient id="bldg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a0a2e"/><stop offset="100%" stop-color="#0d0518"/></linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1a3a"/><stop offset="100%" stop-color="#050d1e"/></linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1440" height="500" fill="url(#sky)"/>
  <!-- Atmospheric glow -->
  <ellipse cx="720" cy="300" rx="500" ry="200" fill="rgba(180,0,255,0.08)"/>
  <ellipse cx="400" cy="400" rx="300" ry="150" fill="rgba(0,180,255,0.06)"/>
  <ellipse cx="1100" cy="380" rx="280" ry="130" fill="rgba(255,0,180,0.07)"/>

  <!-- FAR BG buildings (dark, no neon) -->
  <g fill="#0a0518" opacity="0.9">
    <rect x="0"    y="280" width="60"  height="220"/>
    <rect x="55"   y="310" width="40"  height="190"/>
    <rect x="90"   y="260" width="55"  height="240"/>
    <rect x="140"  y="290" width="35"  height="210"/>
    <rect x="170"  y="250" width="70"  height="250"/>
    <rect x="235"  y="275" width="45"  height="225"/>
    <rect x="275"  y="240" width="60"  height="260"/>
    <rect x="330"  y="270" width="40"  height="230"/>
    <rect x="365"  y="255" width="55"  height="245"/>
    <rect x="415"  y="285" width="35"  height="215"/>
    <rect x="445"  y="245" width="80"  height="255"/>
    <rect x="520"  y="265" width="50"  height="235"/>
    <rect x="565"  y="230" width="65"  height="270"/>
    <rect x="625"  y="260" width="45"  height="240"/>
    <rect x="665"  y="220" width="90"  height="280"/>
    <rect x="750"  y="250" width="55"  height="250"/>
    <rect x="800"  y="235" width="70"  height="265"/>
    <rect x="865"  y="260" width="45"  height="240"/>
    <rect x="905"  y="245" width="60"  height="255"/>
    <rect x="960"  y="270" width="40"  height="230"/>
    <rect x="995"  y="250" width="75"  height="250"/>
    <rect x="1065" y="275" width="50"  height="225"/>
    <rect x="1110" y="240" width="65"  height="260"/>
    <rect x="1170" y="260" width="45"  height="240"/>
    <rect x="1210" y="230" width="80"  height="270"/>
    <rect x="1285" y="255" width="55"  height="245"/>
    <rect x="1335" y="270" width="50"  height="230"/>
    <rect x="1380" y="245" width="60"  height="255"/>
  </g>

  <!-- NEON OUTLINES on tall buildings - PINK -->
  <g filter="url(#glow2)" stroke="#ff00cc" stroke-width="1.5" fill="none" opacity="0.85">
    <!-- Left cluster -->
    <polyline points="80,260 80,80 130,80 130,260"/>
    <line x1="80" y1="80" x2="105" y2="40"/><line x1="105" y1="40" x2="130" y2="80"/>
    <line x1="80" y1="140" x2="130" y2="140"/>
    <line x1="80" y1="180" x2="130" y2="180"/>
    <!-- Center tall -->
    <polyline points="580,265 580,60 660,60 660,265"/>
    <line x1="580" y1="60" x2="620" y2="10"/><line x1="620" y1="10" x2="660" y2="60"/>
    <line x1="580" y1="130" x2="660" y2="130"/>
    <line x1="580" y1="180" x2="660" y2="180"/>
    <line x1="580" y1="220" x2="660" y2="220"/>
    <!-- Right cluster -->
    <polyline points="1200,255 1200,90 1270,90 1270,255"/>
    <line x1="1200" y1="90" x2="1235" y2="45"/><line x1="1235" y1="45" x2="1270" y2="90"/>
    <line x1="1200" y1="150" x2="1270" y2="150"/>
    <line x1="1200" y1="195" x2="1270" y2="195"/>
  </g>

  <!-- NEON OUTLINES - CYAN/BLUE -->
  <g filter="url(#glow2)" stroke="#00eeff" stroke-width="1.5" fill="none" opacity="0.8">
    <!-- Left mid -->
    <polyline points="240,275 240,120 310,120 310,275"/>
    <line x1="240" y1="120" x2="275" y2="75"/><line x1="275" y1="75" x2="310" y2="120"/>
    <line x1="240" y1="175" x2="310" y2="175"/>
    <line x1="240" y1="220" x2="310" y2="220"/>
    <!-- Center right -->
    <polyline points="880,260 880,100 950,100 950,260"/>
    <line x1="880" y1="100" x2="915" y2="55"/><line x1="915" y1="55" x2="950" y2="100"/>
    <line x1="880" y1="160" x2="950" y2="160"/>
    <line x1="880" y1="210" x2="950" y2="210"/>
    <!-- Far right -->
    <polyline points="1340,250 1340,130 1400,130 1400,250"/>
    <line x1="1340" y1="180" x2="1400" y2="180"/>
  </g>

  <!-- NEON - PURPLE accents -->
  <g filter="url(#glow)" stroke="#bf00ff" stroke-width="1" fill="none" opacity="0.7">
    <polyline points="420,280 420,160 480,160 480,280"/>
    <line x1="420" y1="160" x2="450" y2="120"/><line x1="450" y1="120" x2="480" y2="160"/>
    <line x1="420" y1="210" x2="480" y2="210"/>
    <polyline points="1020,265 1020,145 1080,145 1080,265"/>
    <line x1="1020" y1="145" x2="1050" y2="100"/><line x1="1050" y1="100" x2="1080" y2="145"/>
    <line x1="1020" y1="200" x2="1080" y2="200"/>
  </g>

  <!-- FOREGROUND buildings (darkest, silhouette) -->
  <g fill="#060210">
    <rect x="0"    y="380" width="80"  height="120"/>
    <rect x="75"   y="360" width="60"  height="140"/>
    <rect x="130"  y="350" width="100" height="150"/>
    <rect x="225"  y="370" width="70"  height="130"/>
    <rect x="290"  y="340" width="120" height="160"/>
    <rect x="405"  y="365" width="80"  height="135"/>
    <rect x="480"  y="345" width="110" height="155"/>
    <rect x="585"  y="370" width="75"  height="130"/>
    <rect x="655"  y="330" width="140" height="170"/>
    <rect x="790"  y="355" width="90"  height="145"/>
    <rect x="875"  y="340" width="115" height="160"/>
    <rect x="985"  y="365" width="80"  height="135"/>
    <rect x="1060" y="345" width="105" height="155"/>
    <rect x="1160" y="370" width="75"  height="130"/>
    <rect x="1230" y="335" width="130" height="165"/>
    <rect x="1355" y="360" width="85"  height="140"/>
  </g>

  <!-- Ground glow strip -->
  <rect x="0" y="490" width="1440" height="10" fill="rgba(180,0,255,0.3)" filter="url(#glow)"/>
  <rect x="0" y="492" width="1440" height="8"  fill="rgba(0,220,255,0.2)" filter="url(#glow)"/>

  <!-- Scan line overlay -->
  <rect x="0" y="0" width="1440" height="500" fill="url(#scanlines)" opacity="0.04"/>

  <!-- Floating particles -->
  <g fill="#ff00cc" filter="url(#glow)" opacity="0.6">
    <circle cx="150" cy="150" r="1.5"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="80"  r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="120" r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="90" r="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="140" r="1.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#00eeff" filter="url(#glow)" opacity="0.5">
    <circle cx="250" cy="110" r="1"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="70"  r="1.5"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="100" r="1"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="80" r="1.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
