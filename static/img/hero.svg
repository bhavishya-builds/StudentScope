<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fa3f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4fa3f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="210" cy="160" rx="160" ry="130" fill="url(#glow1)"/>
  <ellipse cx="310" cy="80" rx="80" ry="60" fill="url(#glow2)"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="30" cy="40" r="1.2"/><circle cx="80" cy="15" r="0.8"/>
    <circle cx="150" cy="30" r="1.0"/><circle cx="300" cy="20" r="1.4"/>
    <circle cx="380" cy="50" r="0.9"/><circle cx="400" cy="140" r="1.1"/>
    <circle cx="20" cy="200" r="0.8"/><circle cx="50" cy="280" r="1.3"/>
    <circle cx="370" cy="280" r="0.9"/><circle cx="200" cy="10" r="0.7"/>
  </g>
  <ellipse cx="210" cy="170" rx="130" ry="40" fill="none" stroke="rgba(79,163,247,0.2)" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="210" cy="170" r="55" fill="#1a2744" stroke="rgba(79,163,247,0.35)" stroke-width="1.5"/>
  <ellipse cx="195" cy="158" rx="12" ry="8" fill="rgba(79,163,247,0.12)"/>
