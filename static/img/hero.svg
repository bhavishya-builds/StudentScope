  <!-- Rocket with float animation -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="3s" repeatCount="indefinite"/>
    <rect x="199" y="85" width="22" height="38" rx="4" fill="#4fa3f7"/>
    <polygon points="210,73 199,87 221,87" fill="#7ec8f7"/>
    <circle cx="210" cy="97" r="5" fill="#0f1b2d" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="210" cy="97" r="2.5" fill="#a78bfa" opacity="0.7"/>
    <polygon points="199,110 192,125 199,123" fill="#185FA5"/>
    <polygon points="221,110 228,125 221,123" fill="#185FA5"/>
    <polygon points="205,123 215,123 212,137 210,143 208,137" fill="#fbbf24" opacity="0.9">
      <animate attributeName="points" values="205,123 215,123 212,137 210,143 208,137;205,123 215,123 213,141 210,148 207,141;205,123 215,123 212,137 210,143 208,137" dur="0.3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="207,123 213,123 211,133 210,138 209,133" fill="#f87171" opacity="0.8"/>
  </g>
  <!-- Astronaut -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="4s" repeatCount="indefinite"/>
    <ellipse cx="310" cy="200" rx="18" ry="22" fill="#e0e8f8"/>
    <circle cx="310" cy="175" r="16" fill="#c8d8f0" stroke="#a0b8e0" stroke-width="1"/>
    <ellipse cx="310" cy="175" rx="10" ry="10" fill="#1a2744" opacity="0.85"/>
    <ellipse cx="306" cy="171" rx="4" ry="3" fill="rgba(79,163,247,0.5)" transform="rotate(-20,306,171)"/>
    <rect x="290" y="192" width="8" height="18" rx="4" fill="#d0ddf0" transform="rotate(20,294,192)"/>
    <rect x="322" y="192" width="8" height="18" rx="4" fill="#d0ddf0" transform="rotate(-20,326,192)"/>
    <rect x="300" y="218" width="9" height="20" rx="4" fill="#d0ddf0"/>
    <rect x="312" y="218" width="9" height="20" rx="4" fill="#d0ddf0"/>
  </g>
  <!-- Satellite -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;8,5;0,10;-8,5;0,0" dur="7s" repeatCount="indefinite"/>
    <rect x="60" y="130" width="20" height="12" rx="2" fill="#3C3489"/>
    <rect x="44" y="133" width="16" height="6" rx="1" fill="rgba(79,163,247,0.55)"/>
    <rect x="80" y="133" width="16" height="6" rx="1" fill="rgba(79,163,247,0.55)"/>
    <circle cx="70" cy="136" r="3" fill="#a78bfa"/>
    <line x1="70" y1="130" x2="70" y2="121" stroke="#a78bfa" stroke-width="1.2"/>
    <circle cx="70" cy="119" r="2" fill="#fbbf24"/>
  </g>
  <!-- Twinkling stars -->
  <circle cx="140" cy="100" r="2" fill="#fbbf24">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="150" r="1.5" fill="#fbbf24">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="230" r="2" fill="#7ec8f7">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="230" r="1.5" fill="#a78bfa">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <!-- Category pills -->
  <rect x="28" y="153" width="72" height="20" rx="10" fill="rgba(93,219,180,0.15)" stroke="rgba(93,219,180,0.35)" stroke-width="0.8"/>
  <text x="64" y="167" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#5ddbb4">🎓 Scholarship</text>
  <rect x="328" y="97" width="72" height="20" rx="10" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.35)" stroke-width="0.8"/>
  <text x="364" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#c4b5fd">⚡ Hackathon</text>
  <rect x="118" y="255" width="68" height="20" rx="10" fill="rgba(79,163,247,0.15)" stroke="rgba(79,163,247,0.35)" stroke-width="0.8"/>
  <text x="152" y="269" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#7ec8f7">💼 Internship</text>
  <rect x="283" y="255" width="78" height="20" rx="10" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.3)" stroke-width="0.8"/>
  <text x="322" y="269" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#fcd34d">🏆 Competition</text>
</svg>
