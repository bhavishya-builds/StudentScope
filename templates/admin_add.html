{% extends 'base.html' %}
{% block title %}Add Opportunity{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-7">
  <div class="auth-card">
    <h4 class="mb-4"><i class="bi bi-plus-circle-fill text-primary"></i> Add New Opportunity</h4>
    <form method="POST">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Title *</label>
          <input type="text" name="title" class="form-control" required placeholder="e.g. National Scholarship 2025">
        </div>
        <div class="col-md-8">
          <label class="form-label">Organisation *</label>
          <input type="text" name="org" class="form-control" required placeholder="e.g. Ministry of Education">
        </div>
        <div class="col-md-4">
          <label class="form-label">Category *</label>
          <select name="category" class="form-select" required>
            <option>Scholarship</option><option>Internship</option>
            <option>Hackathon</option><option>Competition</option><option>Admission</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Eligibility</label>
          <input type="text" name="eligibility" class="form-control" placeholder="e.g. 2nd year B.Tech">
        </div>
        <div class="col-md-6">
          <label class="form-label">Reward / Stipend</label>
          <input type="text" name="reward" class="form-control" placeholder="e.g. ₹50,000/yr">
        </div>
        <div class="col-md-6">
          <label class="form-label">Deadline *</label>
          <input type="date" name="deadline" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Class / Year Filter</label>
          <input type="text" name="class_filter" class="form-control" placeholder="e.g. 1st Year,2nd Year or All">
        </div>
        <div class="col-12">
          <label class="form-label">Apply Link *</label>
          <input type="url" name="apply_link" class="form-control" required placeholder="https://...">
        </div>
        <div class="col-12">
          <label class="form-label">Tags (comma-separated)</label>
          <input type="text" name="tags" class="form-control" placeholder="e.g. Merit-based,Govt,Open now">
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Add Opportunity</button>
          <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
</div>
{% endblock %}
